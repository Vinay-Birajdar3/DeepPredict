services:
  - type: web
    name: deeppredict-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: MODEL_DIR
        value: /models
      - key: API_HOST
        value: 0.0.0.0
